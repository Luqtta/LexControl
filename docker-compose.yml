version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lexcontrol
      POSTGRES_USER: lexcontrol
      POSTGRES_PASSWORD: lexcontrol
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - m2_cache:/root/.m2
    command: mvn -q quarkus:dev -Dquarkus.http.host=0.0.0.0
    environment:
      DB_URL: jdbc:postgresql://db:5432/lexcontrol
      DB_USER: lexcontrol
      DB_PASSWORD: lexcontrol
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  m2_cache:
