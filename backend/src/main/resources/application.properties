quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:lexcontrol}
quarkus.datasource.password=${DB_PASSWORD:lexcontrol}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/lexcontrol}

quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location
quarkus.http.cors.credentials=true
quarkus.http.cors.access-control-max-age=24H

# Security Headers
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-XSS-Protection".value=1;mode=block
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000;includeSubDomains;preload
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; font-src 'self' https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com; script-src 'self'

jwt.issuer=lexcontrol-api
jwt.expiration=900
jwt.refresh.expiration=604800
jwt.cookie.secure=${COOKIE_SECURE:true}

mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.issuer=lexcontrol-api

smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
smallrye.jwt.new-token.signature-algorithm=RS256

mp.jwt.verify.clock.skew=60

quarkus.http.auth.permission.public.paths=/auth/*,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.http.error.include-stacktrace=never
quarkus.http.error.include-message=never

quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# Logging
quarkus.log.level=INFO
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %m%n

# Not needed: InputSanitizer is used for data cleaning, not SQL injection protection
# SQL injection protection is handled by Hibernate parameterized queries